
services:
  redis:
    image: redis:6.2
    container_name: redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - backend

  postgres:
    container_name: postgres
    image: postgres:15.2
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USERNAME}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - backend

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: rick
      RABBITMQ_DEFAULT_PASS: rick
    networks:
      - backend

  api-gateway:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: api-gateway
    ports:
      - "3000:3000"
    depends_on:
      - redis
      - rabbitmq
      - postgres
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RABBITMQ_URI: amqp://rick:rick@rabbitmq:5672
      DATABASE_URL: postgresql://rick:postgres@postgres:5432/fluffy
    networks:
      - backend

  msvc_auth:
    build: 
      context: .
      dockerfile: apps/msvc_auth/Dockerfile
    container_name: msvc_auth
    ports:
      - "3001:3001"
    depends_on:
      - redis
      - rabbitmq
      - postgres
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RABBITMQ_URI: amqp://rick:rick@rabbitmq:5672
      DATABASE_URL: postgresql://rick:postgres@postgres:5432/fluffy
    networks:
      - backend

  msvc_user:
    build: 
      context: .
      dockerfile: apps/msvc_user/Dockerfile
    container_name: msvc_user
    ports:
      - "3002:3002"
    depends_on:
      - redis
      - rabbitmq
      - postgres
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RABBITMQ_URI: amqp://rick:rick@rabbitmq:5672
      DATABASE_URL: postgresql://rick:postgres@postgres:5432/fluffy
    networks:
      - backend
volumes:
  pgdata:
  redis_data:
networks:
  backend: